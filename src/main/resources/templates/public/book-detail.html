<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('catalog')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
    <a th:href="@{/catalog}" class="inline-flex items-center gap-2 text-sm font-semibold text-primary-700 hover:underline">← Back to catalog</a>
    <div class="mt-7 grid gap-10 lg:grid-cols-[20rem_1fr]">
        <div>
            <div class="relative flex aspect-[4/5] items-end overflow-hidden rounded-4xl bg-gradient-to-br from-primary-700 via-primary-600 to-blue-400 p-8 text-white shadow-lifted">
                <div class="absolute -right-16 -top-16 h-64 w-64 rounded-full border-[44px] border-white/10"></div><div class="absolute bottom-16 right-9 h-20 w-20 rounded-full bg-google-yellow/90"></div>
                <div class="relative"><p class="mb-4 text-xs font-semibold uppercase tracking-[.2em] text-blue-100" th:text="${book.categoryNames()}">Category</p><h1 class="text-3xl font-semibold leading-tight" th:text="${book.title}">Title</h1><p class="mt-3 text-sm text-blue-100" th:text="${book.authorNames()}">Author</p></div>
            </div>
        </div>
        <div class="py-2">
            <div class="flex flex-wrap items-center gap-2">
                <span th:if="${availableCount > 0}" class="chip-green"><span class="h-2 w-2 rounded-full bg-emerald-500"></span><span th:text="${availableCount + ' available now'}">Available</span></span>
                <span th:unless="${availableCount > 0}" class="chip-amber">Currently unavailable</span>
                <span class="chip-slate" th:text="${book.language}">English</span>
            </div>
            <h2 class="mt-6 text-4xl font-semibold tracking-tight md:text-5xl" th:text="${book.title}">Title</h2>
            <p th:if="${book.subtitle}" class="mt-3 text-xl text-muted" th:text="${book.subtitle}">Subtitle</p>
            <p class="mt-5 text-lg font-medium text-slate-700" th:text="${'by ' + book.authorNames()}">by Author</p>
            <p class="mt-8 max-w-3xl leading-8 text-slate-600" th:text="${book.description ?: 'No description is available for this title.'}">Description</p>

            <dl class="mt-9 grid gap-5 border-y border-slate-200 py-6 sm:grid-cols-3">
                <div><dt class="text-xs font-semibold uppercase tracking-wider text-muted">ISBN</dt><dd class="mt-1 text-sm font-medium" th:text="${book.isbn ?: 'Not listed'}">ISBN</dd></div>
                <div><dt class="text-xs font-semibold uppercase tracking-wider text-muted">Published</dt><dd class="mt-1 text-sm font-medium" th:text="${book.publishedYear ?: 'Not listed'}">Year</dd></div>
                <div><dt class="text-xs font-semibold uppercase tracking-wider text-muted">Publisher</dt><dd class="mt-1 text-sm font-medium" th:text="${book.publisher ?: 'Not listed'}">Publisher</dd></div>
            </dl>

            <div class="mt-8 flex flex-wrap gap-3">
                <form sec:authorize="hasRole('MEMBER')" th:action="@{/my/reservations/books/{id}(id=${book.id})}" method="post"><button class="btn-primary" type="submit"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14v18l-7-4-7 4V3Z"/></svg><span th:text="${availableCount > 0 ? 'Reserve for pickup' : 'Join waitlist'}">Reserve</span></button></form>
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn-primary">Sign in to reserve</a>
                <a sec:authorize="hasAnyRole('ADMIN','LIBRARIAN')" th:href="@{/staff/books/{id}(id=${book.id})}" class="btn-secondary">Manage inventory</a>
            </div>
        </div>
    </div>

    <section class="mt-16">
        <h2 class="text-2xl font-semibold">Copy availability</h2>
        <div class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <div th:each="copy : ${copies}" class="surface p-5">
                <div class="flex items-start justify-between gap-3"><div><p class="font-semibold" th:text="${copy.branch.name}">Branch</p><p class="mt-1 text-sm text-muted" th:text="${copy.shelfLocation ?: 'Ask at desk'}">Shelf</p></div><span class="chip-slate" th:text="${#strings.replace(copy.status, '_', ' ')}">Status</span></div>
            </div>
            <p th:if="${copies.isEmpty()}" class="text-sm text-muted">No physical copies have been added yet.</p>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
