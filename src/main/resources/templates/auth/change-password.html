<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('account')}"></nav><div th:replace="~{fragments/layout :: flash}"></div><main class="mx-auto max-w-xl px-4 py-16 sm:px-6"><div class="text-center"><div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-primary-50 text-primary-700"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div><h1 class="mt-5 text-3xl font-semibold tracking-tight">Choose a secure password</h1><p class="mt-3 text-sm leading-6 text-muted">Temporary passwords must be replaced before the rest of the application can be used.</p></div><form th:object="${passwordChangeForm}" th:action="@{/account/password}" method="post" class="surface mt-8 p-6 sm:p-8"><div th:if="${#fields.hasGlobalErrors()}" class="mb-5 rounded-2xl bg-red-50 p-4 text-sm text-red-700"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><div class="grid gap-5"><div><label class="field-label">Current password</label><input type="password" th:field="*{currentPassword}" class="field" autocomplete="current-password"><p class="field-error" th:errors="*{currentPassword}"></p></div><div><label class="field-label">New password</label><input type="password" th:field="*{newPassword}" class="field" autocomplete="new-password"><p class="mt-1.5 text-xs text-muted">Use at least 12 characters and avoid reused passwords.</p><p class="field-error" th:errors="*{newPassword}"></p></div><div><label class="field-label">Confirm new password</label><input type="password" th:field="*{confirmPassword}" class="field" autocomplete="new-password"><p class="field-error" th:errors="*{confirmPassword}"></p></div><button class="btn-primary mt-2 w-full py-3">Update password</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
