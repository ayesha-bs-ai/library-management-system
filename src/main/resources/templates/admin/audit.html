<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('admin')}"></nav><main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div><p class="text-sm font-semibold text-primary-600">Administration</p><h1 class="page-title mt-2">Audit log</h1><p class="page-subtitle">A chronological record of security-sensitive and operational changes.</p></div><div class="mt-8 table-wrap"><table class="data-table"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody><tr th:each="event : ${events.content}"><td th:text="${#temporals.format(event.createdAt,'dd MMM yyyy, HH:mm')}"></td><td class="font-medium" th:text="${event.actorEmail}"></td><td><span class="chip-blue" th:text="${#strings.replace(event.action,'_',' ')}"></span></td><td><p class="font-medium" th:text="${event.entityType}"></p><p class="text-xs text-muted" th:text="${event.entityId}"></p></td><td class="max-w-md truncate" th:text="${event.details}"></td></tr></tbody></table></div><nav th:if="${events.totalPages > 1}" class="mt-8 flex justify-center gap-3"><a th:if="${events.hasPrevious()}" th:href="@{/admin/audit(page=${events.number-1})}" class="btn-secondary">← Previous</a><span class="px-3 py-2 text-sm text-muted" th:text="${'Page ' + (events.number+1) + ' of ' + events.totalPages}"></span><a th:if="${events.hasNext()}" th:href="@{/admin/audit(page=${events.number+1})}" class="btn-secondary">Next →</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
