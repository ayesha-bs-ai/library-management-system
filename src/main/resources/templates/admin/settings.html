<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('admin')}"></nav><div th:replace="~{fragments/layout :: flash}"></div><main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8"><div><p class="text-sm font-semibold text-primary-600">Administration</p><h1 class="page-title mt-2">Circulation policy</h1><p class="page-subtitle">One source of truth for loan, renewal, reservation, and fine rules.</p></div><form th:object="${policyForm}" th:action="@{/admin/settings}" method="post" class="surface mt-8 p-6 sm:p-8"><div class="grid gap-6 sm:grid-cols-2"><div class="sm:col-span-2"><label class="field-label">Policy name</label><input th:field="*{name}" class="field"><p class="field-error" th:errors="*{name}"></p></div><div><label class="field-label">Loan period (days)</label><input type="number" th:field="*{loanPeriodDays}" class="field"><p class="field-error" th:errors="*{loanPeriodDays}"></p></div><div><label class="field-label">Maximum active loans</label><input type="number" th:field="*{maxLoans}" class="field"><p class="field-error" th:errors="*{maxLoans}"></p></div><div><label class="field-label">Maximum renewals</label><input type="number" th:field="*{maxRenewals}" class="field"><p class="field-error" th:errors="*{maxRenewals}"></p></div><div><label class="field-label">Grace period (days)</label><input type="number" th:field="*{gracePeriodDays}" class="field"><p class="field-error" th:errors="*{gracePeriodDays}"></p></div><div><label class="field-label">Fine per overdue day</label><input type="number" step="0.01" th:field="*{finePerDay}" class="field"><p class="field-error" th:errors="*{finePerDay}"></p></div><div><label class="field-label">Maximum fine per loan</label><input type="number" step="0.01" th:field="*{maxFinePerLoan}" class="field"><p class="field-error" th:errors="*{maxFinePerLoan}"></p></div><div><label class="field-label">Borrowing block balance</label><input type="number" step="0.01" th:field="*{blockAtBalance}" class="field"><p class="field-error" th:errors="*{blockAtBalance}"></p></div><div><label class="field-label">Reservation pickup window (days)</label><input type="number" th:field="*{pickupDays}" class="field"><p class="field-error" th:errors="*{pickupDays}"></p></div></div><div class="mt-8 flex justify-end"><button class="btn-primary">Save policy</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
