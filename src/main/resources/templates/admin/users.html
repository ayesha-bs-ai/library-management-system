<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('admin')}"></nav><div th:replace="~{fragments/layout :: flash}"></div><main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div><p class="text-sm font-semibold text-primary-600">Administration</p><h1 class="page-title mt-2">Staff accounts</h1><p class="page-subtitle">Control access with clear roles and account status.</p></div><div class="mt-9 grid gap-7 lg:grid-cols-[1.25fr_.75fr]"><section class="table-wrap"><table class="data-table"><thead><tr><th>Staff member</th><th>Role</th><th>Status</th><th>Created</th><th class="text-right">Action</th></tr></thead><tbody><tr th:each="user : ${users}"><td><div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-full bg-primary-100 font-bold text-primary-700" th:text="${#strings.substring(user.displayName,0,1)}"></div><div><p class="font-semibold text-ink" th:text="${user.displayName}"></p><p class="text-xs text-muted" th:text="${user.email}"></p></div></div></td><td><span class="chip-blue" th:text="${user.role}"></span></td><td><span th:class="${user.enabled ? 'chip-green' : 'chip-red'}" th:text="${user.enabled ? 'Enabled' : 'Disabled'}"></span></td><td th:text="${#temporals.format(user.createdAt,'dd MMM yyyy')}"></td><td class="text-right"><form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post"><button class="text-sm font-semibold" th:classappend="${user.enabled ? ' text-red-600' : ' text-emerald-700'}" th:text="${user.enabled ? 'Disable' : 'Enable'}"></button></form></td></tr></tbody></table></section><aside><form th:object="${userForm}" th:action="@{/admin/users}" method="post" class="surface p-6"><h2 class="text-lg font-semibold">Add staff account</h2><p class="mt-1 text-sm text-muted">The temporary password should be shared securely.</p><div th:if="${#fields.hasGlobalErrors()}" class="mt-4 rounded-xl bg-red-50 p-3 text-sm text-red-700"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><div class="mt-6 grid gap-4"><div><label class="field-label">Display name</label><input th:field="*{displayName}" class="field"><p class="field-error" th:errors="*{displayName}"></p></div><div><label class="field-label">Email</label><input type="email" th:field="*{email}" class="field"><p class="field-error" th:errors="*{email}"></p></div><div><label class="field-label">Role</label><select th:field="*{role}" class="field"><option th:each="r : ${roles}" th:value="${r}" th:text="${#strings.capitalize(#strings.toLowerCase(r))}"></option></select></div><div><label class="field-label">Temporary password</label><input type="password" th:field="*{temporaryPassword}" class="field" autocomplete="new-password"><p class="field-error" th:errors="*{temporaryPassword}"></p></div></div><button class="btn-primary mt-6 w-full">Create account</button></form><div class="mt-5 grid grid-cols-2 gap-3"><a th:href="@{/admin/settings}" class="btn-secondary">Policy</a><a th:href="@{/admin/audit}" class="btn-secondary">Audit log</a></div></aside></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
