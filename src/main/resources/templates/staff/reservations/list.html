<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('reservations')}"></nav><div th:replace="~{fragments/layout :: flash}"></div><main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div><h1 class="page-title">Reservation queue</h1><p class="page-subtitle">Waiting members and books ready for pickup, ordered fairly by request time.</p></div><div class="mt-8 table-wrap"><table class="data-table"><thead><tr><th>Book</th><th>Member</th><th>Requested</th><th>Status</th><th>Pickup expiry</th><th class="text-right">Action</th></tr></thead><tbody><tr th:each="r : ${reservations}"><td><p class="font-semibold text-ink" th:text="${r.book.title}">Book</p><p class="text-xs text-muted" th:text="${r.book.authorNames()}">Author</p></td><td><a th:href="@{/staff/members/{id}(id=${r.member.id})}" class="font-semibold text-primary-700" th:text="${r.member.fullName}">Member</a><p class="text-xs text-muted" th:text="${r.member.membershipNumber}"></p></td><td th:text="${#temporals.format(r.createdAt,'dd MMM yyyy, HH:mm')}">Date</td><td><span th:class="${r.status.name() == 'READY_FOR_PICKUP' ? 'chip-green' : 'chip-amber'}" th:text="${#strings.replace(r.status,'_',' ')}">Status</span></td><td th:text="${r.expiresAt != null ? #temporals.format(r.expiresAt,'dd MMM yyyy, HH:mm') : 'Waiting'}">Expiry</td><td class="text-right"><form data-confirm="Cancel this reservation?" th:action="@{/staff/reservations/{id}/cancel(id=${r.id})}" method="post"><button class="text-sm font-semibold text-red-600 hover:underline">Cancel</button></form></td></tr><tr th:if="${reservations.isEmpty()}"><td colspan="6" class="py-16 text-center text-muted">The reservation queue is clear.</td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
