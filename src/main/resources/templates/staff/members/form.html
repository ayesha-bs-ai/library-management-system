<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('members')}"></nav><div th:replace="~{fragments/layout :: flash}"></div>
<main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8"><a th:href="${editing} ? @{/staff/members/{id}(id=${memberId})} : @{/staff/members}" class="text-sm font-semibold text-primary-700">← Back</a><div class="mt-5"><h1 class="page-title" th:text="${title}">Member</h1><p class="page-subtitle">Create a clear membership record and optional self-service account.</p></div>
<form th:object="${memberForm}" th:action="${editing} ? @{/staff/members/{id}(id=${memberId})} : @{/staff/members}" method="post" class="surface mt-8 p-6 sm:p-8"><div th:if="${#fields.hasGlobalErrors()}" class="mb-6 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div>
<h2 class="text-lg font-semibold">Member details</h2><div class="mt-5 grid gap-6 sm:grid-cols-2"><div><label class="field-label">Membership number</label><input th:field="*{membershipNumber}" class="field" placeholder="MEM-1004"><p class="field-error" th:errors="*{membershipNumber}"></p></div><div><label class="field-label">Full name</label><input th:field="*{fullName}" class="field" placeholder="Full name"><p class="field-error" th:errors="*{fullName}"></p></div><div><label class="field-label">Email</label><input type="email" th:field="*{email}" class="field" placeholder="member@example.com"><p class="field-error" th:errors="*{email}"></p></div><div><label class="field-label">Phone</label><input th:field="*{phone}" class="field" placeholder="+92 300 0000000"><p class="field-error" th:errors="*{phone}"></p></div><div class="sm:col-span-2"><label class="field-label">Address</label><textarea th:field="*{address}" class="field min-h-24" placeholder="Optional postal address"></textarea><p class="field-error" th:errors="*{address}"></p></div><div><label class="field-label">Member type</label><select th:field="*{type}" class="field"><option th:each="t : ${memberTypes}" th:value="${t}" th:text="${#strings.capitalize(#strings.toLowerCase(t))}"></option></select></div><div><label class="field-label">Status</label><select th:field="*{status}" class="field"><option th:each="s : ${memberStatuses}" th:value="${s}" th:text="${#strings.capitalize(#strings.toLowerCase(s))}"></option></select></div><div><label class="field-label">Joined on</label><input type="date" th:field="*{joinedOn}" class="field"><p class="field-error" th:errors="*{joinedOn}"></p></div><div><label class="field-label">Expires on</label><input type="date" th:field="*{expiresOn}" class="field"><p class="field-error" th:errors="*{expiresOn}"></p></div></div>
<div class="my-8 border-t border-slate-200"></div><h2 class="text-lg font-semibold">Member portal</h2><label class="mt-5 flex cursor-pointer items-start gap-3 rounded-2xl bg-primary-50 p-4"><input type="checkbox" th:field="*{createPortalAccount}" class="mt-1 h-4 w-4 rounded border-slate-300 text-primary-600"><span><span class="block text-sm font-semibold text-primary-900">Enable self-service access</span><span class="mt-1 block text-xs leading-5 text-primary-800">The member can view loans, renew books, place reservations, and read notifications.</span></span></label><div class="mt-5"><label class="field-label" for="temporaryPassword" th:text="${editing ? 'New temporary password (optional)' : 'Temporary password'}">Password</label><input id="temporaryPassword" type="password" th:field="*{temporaryPassword}" class="field" placeholder="At least 10 characters" autocomplete="new-password"><p class="mt-1.5 text-xs text-muted" th:text="${editing ? 'Leave blank to keep the current password.' : 'Required when portal access is enabled.'}"></p><p class="field-error" th:errors="*{temporaryPassword}"></p></div>
<div class="mt-8 flex justify-end gap-3"><a th:href="${editing} ? @{/staff/members/{id}(id=${memberId})} : @{/staff/members}" class="btn-ghost">Cancel</a><button class="btn-primary" th:text="${editing ? 'Save changes' : 'Register member'}">Save</button></div></form>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
