<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('members')}"></nav><div th:replace="~{fragments/layout :: flash}"></div>
<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><h1 class="page-title">Members</h1><p class="page-subtitle">Membership status, borrowing history, and account access in one place.</p></div><a th:href="@{/staff/members/new}" class="btn-primary">+ Register member</a></div>
<form th:action="@{/staff/members}" class="mt-8 flex max-w-2xl items-center gap-3 rounded-full border border-slate-200 bg-white p-2 pl-5 shadow-soft"><svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input name="q" th:value="${q}" class="min-w-0 flex-1 border-0 bg-transparent py-2 outline-none" placeholder="Name, membership number, or email"><button class="btn-primary">Search</button></form>
<div class="mt-8 table-wrap"><table class="data-table"><thead><tr><th>Member</th><th>Membership</th><th>Type</th><th>Status</th><th>Expires</th><th class="text-right">Action</th></tr></thead><tbody><tr th:each="member : ${members}"><td><div class="flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-full bg-primary-100 font-bold text-primary-700" th:text="${#strings.substring(member.fullName,0,1)}">M</div><div><p class="font-semibold text-ink" th:text="${member.fullName}">Name</p><p class="text-xs text-muted" th:text="${member.email}">Email</p></div></div></td><td class="font-mono text-xs" th:text="${member.membershipNumber}">Number</td><td><span class="chip-slate" th:text="${member.type}">Type</span></td><td><span th:class="${member.status.name() == 'ACTIVE' ? 'chip-green' : 'chip-red'}" th:text="${member.status}">Status</span></td><td th:text="${#temporals.format(member.expiresOn,'dd MMM yyyy')}">Date</td><td class="text-right"><a th:href="@{/staff/members/{id}(id=${member.id})}" class="font-semibold text-primary-700 hover:underline">View</a></td></tr><tr th:if="${members.isEmpty()}"><td colspan="6" class="py-16 text-center text-muted">No matching members found.</td></tr></tbody></table></div>
<nav th:if="${result.totalPages > 1}" class="mt-8 flex justify-center gap-3"><a th:if="${result.hasPrevious()}" th:href="@{/staff/members(q=${q},page=${result.number-1})}" class="btn-secondary">← Previous</a><span class="px-3 py-2 text-sm text-muted" th:text="${'Page ' + (result.number+1) + ' of ' + result.totalPages}"></span><a th:if="${result.hasNext()}" th:href="@{/staff/members(q=${q},page=${result.number+1})}" class="btn-secondary">Next →</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
