<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body>
<nav th:replace="~{fragments/layout :: nav('books')}"></nav><div th:replace="~{fragments/layout :: flash}"></div>
<main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8"><a th:href="${editing} ? @{/staff/books/{id}(id=${bookId})} : @{/staff/books}" class="text-sm font-semibold text-primary-700">← Back</a><div class="mt-5"><h1 class="page-title" th:text="${title}">Book</h1><p class="page-subtitle">Keep the catalog clear, searchable, and useful to readers.</p></div>
<form th:object="${bookForm}" th:action="${editing} ? @{/staff/books/{id}(id=${bookId})} : @{/staff/books}" method="post" class="surface mt-8 p-6 sm:p-8">
<div th:if="${#fields.hasGlobalErrors()}" class="mb-6 rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p></div>
<div class="grid gap-6 sm:grid-cols-2">
<div class="sm:col-span-2"><label class="field-label" for="title">Title</label><input id="title" th:field="*{title}" class="field" placeholder="Book title"><p class="field-error" th:errors="*{title}"></p></div>
<div class="sm:col-span-2"><label class="field-label" for="subtitle">Subtitle</label><input id="subtitle" th:field="*{subtitle}" class="field" placeholder="Optional subtitle"><p class="field-error" th:errors="*{subtitle}"></p></div>
<div><label class="field-label" for="isbn">ISBN</label><input id="isbn" th:field="*{isbn}" class="field" placeholder="9780134685991"><p class="field-error" th:errors="*{isbn}"></p></div>
<div><label class="field-label" for="publishedYear">Publication year</label><input id="publishedYear" th:field="*{publishedYear}" type="number" class="field" placeholder="2024"><p class="field-error" th:errors="*{publishedYear}"></p></div>
<div><label class="field-label" for="authors">Authors</label><input id="authors" th:field="*{authors}" class="field" placeholder="Joshua Bloch, Jane Smith"><p class="mt-1.5 text-xs text-muted">Separate multiple authors with commas.</p><p class="field-error" th:errors="*{authors}"></p></div>
<div><label class="field-label" for="categories">Categories</label><input id="categories" th:field="*{categories}" class="field" placeholder="Java, Software Engineering"><p class="mt-1.5 text-xs text-muted">Separate multiple categories with commas.</p><p class="field-error" th:errors="*{categories}"></p></div>
<div><label class="field-label" for="publisher">Publisher</label><input id="publisher" th:field="*{publisher}" class="field" placeholder="Publisher name"><p class="field-error" th:errors="*{publisher}"></p></div>
<div><label class="field-label" for="language">Language</label><input id="language" th:field="*{language}" class="field"><p class="field-error" th:errors="*{language}"></p></div>
<div class="sm:col-span-2"><label class="field-label" for="description">Description</label><textarea id="description" th:field="*{description}" class="field min-h-36" placeholder="A clear description for readers"></textarea><p class="field-error" th:errors="*{description}"></p></div>
</div><div class="mt-8 flex flex-wrap justify-end gap-3"><a th:href="${editing} ? @{/staff/books/{id}(id=${bookId})} : @{/staff/books}" class="btn-ghost">Cancel</a><button class="btn-primary" type="submit" th:text="${editing ? 'Save changes' : 'Add book'}">Save</button></div>
</form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
