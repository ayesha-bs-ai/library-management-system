<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body>
<nav th:replace="~{fragments/layout :: nav('books')}"></nav><div th:replace="~{fragments/layout :: flash}"></div>
<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
<div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><h1 class="page-title">Books and inventory</h1><p class="page-subtitle">Manage bibliographic records, barcodes, and copy availability.</p></div><a th:href="@{/staff/books/new}" class="btn-primary">+ Add book</a></div>
<form th:action="@{/staff/books}" class="mt-8 flex max-w-2xl items-center gap-3 rounded-full border border-slate-200 bg-white p-2 pl-5 shadow-soft"><svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input name="q" th:value="${q}" class="min-w-0 flex-1 border-0 bg-transparent py-2 outline-none" placeholder="Search catalog records"><button class="btn-primary" type="submit">Search</button></form>
<div class="mt-8 table-wrap"><table class="data-table"><thead><tr><th>Title</th><th>ISBN</th><th>Availability</th><th>Category</th><th class="text-right">Action</th></tr></thead><tbody><tr th:each="book : ${books}"><td><div class="flex items-center gap-3"><div th:if="${book.hasCoverImage()}" class="h-10 w-9 shrink-0 overflow-hidden rounded-lg"><img th:src="${book.getCoverImage()}" th:alt="${book.title}" class="h-full w-full object-cover"></div><div th:unless="${book.hasCoverImage()}" class="grid h-10 w-9 place-items-center rounded-lg bg-primary-600 font-bold text-white" th:text="${#strings.substring(book.title,0,1)}">B</div><div><p class="max-w-xs truncate font-semibold text-ink" th:text="${book.title}">Title</p><p class="max-w-xs truncate text-xs text-muted" th:text="${book.authorNames()}">Author</p></div></div></td><td th:text="${book.isbn ?: '—'}">ISBN</td><td><span th:if="${availability[book.id] > 0}" class="chip-green" th:text="${availability[book.id] + ' available'}">Available</span><span th:unless="${availability[book.id] > 0}" class="chip-amber">Unavailable</span></td><td><span class="chip-slate" th:text="${book.categories.isEmpty() ? 'Uncategorized' : book.categories.iterator().next().name}">Category</span></td><td class="text-right"><a th:href="@{/staff/books/{id}(id=${book.id})}" class="text-sm font-semibold text-primary-700 hover:underline">Manage</a></td></tr><tr th:if="${books.isEmpty()}"><td colspan="5" class="py-16 text-center text-muted">No matching books found.</td></tr></tbody></table></div>
<nav th:if="${result.totalPages > 1}" class="mt-8 flex justify-center gap-3"><a th:if="${result.hasPrevious()}" th:href="@{/staff/books(q=${q},page=${result.number-1})}" class="btn-secondary">← Previous</a><span class="px-3 py-2 text-sm text-muted" th:text="${'Page ' + (result.number+1) + ' of ' + result.totalPages}">Page</span><a th:if="${result.hasNext()}" th:href="@{/staff/books(q=${q},page=${result.number+1})}" class="btn-secondary">Next →</a></nav>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
