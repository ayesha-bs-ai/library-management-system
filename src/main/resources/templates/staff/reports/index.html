<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${title})}"></head><body><nav th:replace="~{fragments/layout :: nav('reports')}"></nav><div th:replace="~{fragments/layout :: flash}"></div><main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8"><div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><h1 class="page-title">Reports</h1><p class="page-subtitle">A clear view of circulation and inventory health, with portable exports.</p></div><a th:href="@{/staff/reports/active-loans.csv}" class="btn-primary">Download active loans CSV</a></div><section class="mt-9 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"><div class="stat-card"><p class="text-sm text-muted">Catalog titles</p><p class="text-3xl font-semibold" th:text="${snapshot.titles}">0</p></div><div class="stat-card"><p class="text-sm text-muted">Physical copies</p><p class="text-3xl font-semibold" th:text="${snapshot.copies}">0</p></div><div class="stat-card"><p class="text-sm text-muted">Active loans</p><p class="text-3xl font-semibold" th:text="${snapshot.activeLoans}">0</p></div><div class="stat-card"><p class="text-sm text-muted">Overdue loans</p><p class="text-3xl font-semibold text-red-600" th:text="${snapshot.overdueLoans}">0</p></div></section><section class="mt-8 surface overflow-hidden"><div class="border-b border-slate-200 px-6 py-5"><h2 class="text-lg font-semibold">Current circulation</h2><p class="mt-1 text-sm text-muted">All books presently checked out</p></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>Book</th><th>Member</th><th>Barcode</th><th>Due date</th><th>Status</th></tr></thead><tbody><tr th:each="loan : ${activeLoans}"><td class="font-semibold text-ink" th:text="${loan.copy.book.title}"></td><td th:text="${loan.member.fullName}"></td><td class="font-mono text-xs" th:text="${loan.copy.barcode}"></td><td th:text="${#temporals.format(loan.dueOn,'dd MMM yyyy')}"></td><td><span class="chip-amber">Active</span></td></tr></tbody></table></div></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
