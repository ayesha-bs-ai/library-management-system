spring:
  application:
    name: library-management-system
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/librarydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: localhost
    port: 1025
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  library-name: ${LIBRARY_NAME:Library Hub}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  currency: ${APP_CURRENCY:PKR}
  mail-enabled: ${MAIL_ENABLED:false}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
